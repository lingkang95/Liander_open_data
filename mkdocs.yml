site_name: liander-open-data
site_description: Lightweight SQLite database and Python API for Liander's open SBI load profiles.
site_url: https://lingkang95.github.io/Liander_open_data/
repo_url: https://github.com/lingkang95/Liander_open_data
repo_name: lingkang95/Liander_open_data
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
  - User guide:
      - The data: data.md
      - Data model (SQL schema): data-model.md
      - Command line: cli.md
      - Recipes: recipes.md
  - API reference:
      - ProfileDatabase: reference/database.md
      - SBI dictionary: reference/dictionary.md
  - Development:
      - Contributing: contributing.md
      - Releasing to PyPI: releasing.md
      - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
